[project]
name = "hk-ipo-agentic-risk"
version = "0.1.0"
description = "Evidence-gated Agentic AI prototype for HK IPO risk warning"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "PyMuPDF>=1.24,<2",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
